<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moksha Admin | Login</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--sub:#8b949e;--line:#30363d;--acc:#d9a05b;--err:#f85149}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,'Segoe UI',Roboto,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:38px 34px;width:100%;max-width:380px}
h1{font-size:1.6rem;letter-spacing:3px;text-transform:uppercase}
h1 span{color:var(--acc)}
p.sub{color:var(--sub);font-size:.9rem;margin:8px 0 24px}
label{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--sub);margin-bottom:6px}
input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);padding:12px 14px;border-radius:10px;font:inherit;outline:none;transition:.2s}
input:focus{border-color:var(--acc)}
button{width:100%;margin-top:18px;background:var(--acc);color:#111;border:none;padding:13px;border-radius:26px;font:inherit;font-weight:700;cursor:pointer;transition:.2s}
button:hover{filter:brightness(1.1)}
.err{display:none;background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.3);color:var(--err);padding:10px 14px;border-radius:10px;margin-top:16px;font-size:.9rem}
.err.on{display:block}
.hint{margin-top:20px;color:var(--sub);font-size:.78rem;text-align:center}
</style></head>
<body>
  <div class="card">
    <h1>Moksha <span>Admin</span></h1>
    <p class="sub">Enter the admin password to view the database.</p>
    <form method="post" action="/admin/login">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autofocus placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
      <button type="submit">Unlock Dashboard</button>
      {% if error %}<div class="err on">{{ error }}</div>{% endif %}
      <div style="margin-top:22px;text-align:center;"><a href="/" style="color:var(--sub);font-size:.85rem;text-decoration:none;transition:.2s;">&larr; Back to Moksha Website</a></div>
    </form>
  </div>
</body>
</html>
